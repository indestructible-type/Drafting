# Build the whole family with Google Fonts' pipeline:
#   cd sources && gftools builder config.yaml
sources:
  - designspace/DraftingMono.designspace
  - designspace/DraftingMono-Italic.designspace
familyName: Drafting Mono
outputDir: ../fonts
woffDir: ../fonts/woff2
buildVariable: true
buildStatic: true
buildTTF: true
buildOTF: true
buildWebfont: true
autohintTTF: true
buildSmallCap: true
cleanUp: true
axisOrder:
  - wght
  - ital
# Explicit STAT per font: without it the builder merges the SC family into
# the main family's STAT and duplicates the ital axis. SC fonts get copies.
stat:
  DraftingMono[wght].ttf:
    - name: Weight
      tag: wght
      values:
        - name: Thin
          value: 100
        - name: ExtraLight
          value: 200
        - name: Light
          value: 300
        - name: Regular
          value: 400
          flags: 2
          linkedValue: 700
        - name: Medium
          value: 500
        - name: SemiBold
          value: 600
        - name: Bold
          value: 700
    - name: Italic
      tag: ital
      values:
        - name: Roman
          value: 0
          flags: 2
          linkedValue: 1
  DraftingMono-Italic[wght].ttf:
    - name: Weight
      tag: wght
      values:
        - name: Thin
          value: 100
        - name: ExtraLight
          value: 200
        - name: Light
          value: 300
        - name: Regular
          value: 400
          flags: 2
          linkedValue: 700
        - name: Medium
          value: 500
        - name: SemiBold
          value: 600
        - name: Bold
          value: 700
    - name: Italic
      tag: ital
      values:
        - name: Italic
          value: 1
